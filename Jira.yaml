run: |
  FIXED_VERSION="1.2.3"
  echo "Fetching tickets for version: $FIXED_VERSION"

  QUERY="project=SMAR AND status=Closed AND fixVersion=\"${FIXED_VERSION}\""

  curl -s -u "${{ secrets.JIRA_USER }}:${{ secrets.JIRA_TOKEN }}" \
    -G \
    --data-urlencode "jql=$QUERY" \
    -H "Content-Type: application/json" \
    "${{ secrets.JIRA_URL }}/rest/api/2/search" \
    | jq -r '.issues[].key' | tee tickets.txt

  echo "----- Ticket Numbers -----"
  cat tickets.txt
