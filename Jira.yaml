name: Jira Fixed Version Mapping

on:
  workflow_dispatch:
    inputs:
      fixed_version:
        description: 'Jira Fixed Version'
        required: true
        type: string
  push:
    branches:
      - main

jobs:
  mapping:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Jira Tickets by Fixed Version
        env:
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_PASS: ${{ secrets.JIRA_PASS }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          FIXED_VERSION: ${{ github.event.inputs.fixed_version }}
        run: |
          echo "Fetching Jira issues for Fixed Version: $FIXED_VERSION"

          # Jira JQL same as your Python example
          JQL="project = SMAR AND status = Closed AND fixVersion = \"$FIXED_VERSION\""

          curl -s -u "$JIRA_USER:$JIRA_PASS" \
            -G "$JIRA_BASE_URL/rest/api/2/search" \
            --data-urlencode "jql=$JQL" \
            --data-urlencode "maxResults=1000" \
            --data-urlencode "fields=key,description" \
            -H "Accept: application/json" > tickets.json

          echo "Total issues found:"
          cat tickets.json | jq '.issues | length'

      - name: Extract Mapping into CSV
        run: |
          echo "Jira Ticket,Repository,Git Tag,PR Name" > mapping.csv

          # NOTE: Replace '.fields.description' parsing with actual GitHub integration field path
          jq -r '
            .issues[] as $i |
            $i.key as $ticket |
            ($i.fields.description | split("\n") | map(select(length > 0))[]? |
              [$ticket, ., "TBD", "TBD"]) | @csv
          ' tickets.json >> mapping.csv

          echo "Generated mapping.csv:"
          cat mapping.csv

      - name: Upload Mapping CSV
        uses: actions/upload-artifact@v4
        with:
          name: jira-github-mapping
          path: mapping.csv
