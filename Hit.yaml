- name: Check for high/critical vulnerabilities
  run: |
    HIGH=$(jq '.vulnerabilityStatistics.high' ui/Whitesource/scan_report.json)
    CRITICAL=$(jq '.vulnerabilityStatistics.critical // 0' ui/Whitesource/scan_report.json)

    echo "High: $HIGH"
    echo "Critical: $CRITICAL"

    if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
      echo "❌ Found High or Critical vulnerabilities"
      exit 1
    else
      echo "✅ No High or Critical vulnerabilities"
    fi
