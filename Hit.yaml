- name: Check for HIGH/CRITICAL in Mend SAST
  if: always()
  run: |
    FILE=".mend/logs/sast/sast.json"

    if [ ! -f "$FILE" ]; then
      echo "SAST result file not found!"
      exit 1
    fi

    # Count HIGH and CRITICAL issues
    HIGH=$(jq '[.[] | select(.severity == "HIGH")] | length' "$FILE")
    CRITICAL=$(jq '[.[] | select(.severity == "CRITICAL")] | length' "$FILE")

    echo "High severity issues: $HIGH"
    echo "Critical severity issues: $CRITICAL"

    if [ "$HIGH" -gt 0 ] || [ "$CRITICAL" -gt 0 ]; then
      echo "❌ Failing build due to HIGH or CRITICAL issues"
      exit 1
    else
      echo "✅ No blocking vulnerabilities found"
    fi
